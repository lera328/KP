# HTTP-сервер: ACME challenge для Let's Encrypt + редирект на HTTPS
server {
    listen 80;
    server_name kiberone-school.duckdns.org _;

    # Webroot для certbot (acme http-01 challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное — на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Основной HTTPS-сервер
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kiberone-school.duckdns.org;
    client_max_body_size 25m;

    ssl_certificate     /etc/letsencrypt/live/kiberone-school.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiberone-school.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # API → Django (gunicorn)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin (панель Django, не путать с /admin/ React)
    location /django-admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portfolio PDF
    location /portfolio/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Раздача media и static напрямую через nginx
    location /media/ {
        alias /usr/share/nginx/media/;
        access_log off;
        expires 7d;
    }

    location /static/ {
        alias /usr/share/nginx/static/;
        access_log off;
        expires 30d;
    }

    # Статические ассеты (JS, CSS) — кэш на 1 год (имена с хэшем)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — index.html без кэша
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
}
